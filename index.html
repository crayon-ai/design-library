<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>优质设计库</title><style>
:root{--bg:#f6f1ea;--ink:#25221e;--mute:#8a8178;--card:#fffdf9;--line:#e9e1d6;--green:#2f4a3a}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 600px at 80% -10%,#ece6f5 0,transparent 60%),var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;padding:72px 6vw 96px}
header{max-width:1200px;margin:0 auto 48px}h1{font:400 44px/1.1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.02em}
header p{color:var(--mute);margin-top:12px}.count{display:inline-block;margin-top:20px;padding:6px 14px;border-radius:99px;background:var(--green);color:#f6f1ea;font-size:13px}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(60,40,20,.04),0 18px 40px -24px rgba(60,40,20,.25);cursor:zoom-in;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(60,40,20,.04),0 28px 50px -24px rgba(60,40,20,.32)}
.ph{aspect-ratio:16/10;overflow:hidden;background:#eee6dc}.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
figcaption{padding:20px 22px 22px}.meta{display:flex;gap:10px;color:var(--mute);font-size:12px}.no{font-variant-numeric:tabular-nums;color:var(--green);font-weight:600}
h2{font:500 19px/1.35 "Songti SC","Noto Serif SC",Georgia,serif;margin:6px 0 10px}.why{font-size:14px}.bor{font-size:13px;color:#4a4540;margin-top:10px}.bor b{display:inline-block;margin-right:8px;font-weight:500;font-size:11px;padding:1px 8px;border-radius:99px;background:#e6efe8;color:var(--green)}
.src{font-size:12px;color:var(--mute);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#lb{position:fixed;inset:0;background:rgba(30,26,22,.86);display:none;align-items:center;justify-content:center;padding:4vw;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:12px}
</style></head><body><header><h1>优质设计库</h1><p>孙涛挑过、觉得好看的设计。点图放大。</p><span class="count">共 5 张</span></header>
<main class="grid"><figure class="card" onclick="z(this)"><div class="ph"><img src="images/2026-11-05_causal-about-scatter.jpg" alt="Causal · About 漂浮素材段" loading="lazy"></div>
<figcaption><div class="meta"><span class="no">005</span><span>2026-11-05</span></div>
<h2>Causal · About 漂浮素材段</h2><p class="why">用户喜欢：纯白底上，各种形状（倾斜图片卡、PDF条、待办卡、Mood board）散落铺开的拼贴效果</p><p class="bor"><b>可借鉴</b>大留白白底 + 多形状素材轻微旋转/投影叠放；彩色只来自素材内容本身</p><p class="src">Causal 首页往下第4段 · causal.so</p></figcaption></figure><figure class="card" onclick="z(this)"><div class="ph"><img src="images/2026-11-05_causal-roadmap.jpg" alt="Causal · Roadmap（产品路线图）" loading="lazy"></div>
<figcaption><div class="meta"><span class="no">004</span><span>2026-11-05</span></div>
<h2>Causal · Roadmap（产品路线图）</h2><p class="why">用户喜欢：三列长条形状态头（Considering / Planned / Building）的形状，以及对应的淡紫、淡蓝、琥珀黄</p><p class="bor"><b>可借鉴</b>看板列头用 soft + pill 语义色，不是强饱和；卡片仍落在灰阶系统里</p><p class="src">Causal 全站拆解 · causal.so/roadmap</p></figcaption></figure><figure class="card" onclick="z(this)"><div class="ph"><img src="images/2026-11-05_causal-blog.jpg" alt="Causal · Blog（博客列表页）" loading="lazy"></div>
<figcaption><div class="meta"><span class="no">003</span><span>2026-11-05</span></div>
<h2>Causal · Blog（博客列表页）</h2><p class="why">用户喜欢：圆角矩形博客卡片网格；每张卡是大幅模糊渐变封面 + 居中白字标题；页面底色近白非白</p><p class="bor"><b>可借鉴</b>短 Hero + 圆角矩形卡片网格；封面用颗粒渐变而非摄影；卡下信息用 Caption · 分类 · 时长</p><p class="src">Causal 全站拆解 · causal.so/blog</p></figcaption></figure><figure class="card" onclick="z(this)"><div class="ph"><img src="images/2026-11-05_craft.jpg" alt="Craft（笔记/文档 App 官网）" loading="lazy"></div>
<figcaption><div class="meta"><span class="no">002</span><span>2026-11-05</span></div>
<h2>Craft（笔记/文档 App 官网）</h2><p class="why">天空云朵背景 + 柔和阴影卡片层叠，奶油蓝调 Soft UI</p><p class="bor"><b>可借鉴</b>层叠软卡片 + 柔阴影；衬线大标题配单颗深色胶囊</p><p class="src">质感加推 11-05 #09 · craft.do 官网直截</p></figcaption></figure><figure class="card" onclick="z(this)"><div class="ph"><img src="images/2026-11-05_grail.jpg" alt="Grail（现实任务 RPG 化 iOS 应用官网）" loading="lazy"></div>
<figcaption><div class="meta"><span class="no">001</span><span>2026-11-05</span></div>
<h2>Grail（现实任务 RPG 化 iOS 应用官网）</h2><p class="why">黑底配衬线大标题和粉色胶囊按钮；App 卡片在空中漂浮散落</p><p class="bor"><b>可借鉴</b>滚动带动 3D 场景 + matter.js 物理漂浮卡片；单颗粉胶囊 CTA</p><p class="src">每日审美推送 11-05 #03 · Awwwards</p></figcaption></figure></main><div id="lb" onclick="this.style.display='none'"><img></div>
<script>function z(f){var l=document.getElementById('lb');l.querySelector('img').src=f.querySelector('img').src;l.style.display='flex'}</script></body></html>
